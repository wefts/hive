volumes:
  # The Postgres datadir — pre-existing (ADR-0015: named explicitly, not left to
  # compose's default `<project>_pgdata` naming, so a differently-invoked project
  # name can never cause a fresh, empty volume to be created by accident).
  hive_pgdata:
    external: true
  # web_channel's private durable store (conversation log + local users). Created
  # owned by the non-root runtime uid (see the plugin Dockerfile). Never committed.
  web_channel_data:
