# Main orchestrator for this hive — wires the public Swarm kernel substrate
# plus private/local plugin adapters.
#
# This repo lives next to the public `swarm/` repo. The public repo ships only
# generic substrate (`../swarm/dev/docker-compose.yml`, the STANDALONE local-dev
# helper — not used by this file, see ADR-0015) + the service Dockerfiles
# (packaging); THIS file is the instance orchestrator and stays private.
#
# Run via the layered-env wrapper (ADR-0015 — REQUIRED, not `docker compose`
# directly, though the compose file itself also hard-errors on an unset
# SWARM_ENV as a backstop): `SWARM_ENV=staging scripts/compose up -d`.
# Plugins load secrets via `env_file`.
#
# Topology (single node): Postgres, the Elixir kernel, and the Python ML service
# are all containerized here; Ollama runs IN the stack (GPU). Grow this file
# spawn -> compose -> k8s without touching the kernel (the gRPC port ABI is
# invariant — see system_architecture §9/§10).

services:
  # --- Postgres + pg_search (ParadeDB) + pgvector — the one stateful
  # dependency, owned by the kernel. Defined HERE directly (not via the
  # swarm/dev include) so a recreate can never silently revert to the plain
  # pgvector image (board/done/fix-compose-postgres-drift, ADR-0015): ParadeDB
  # only writes its preload libraries into a FRESH datadir's postgresql.conf,
  # so the `command:` below is required on every recreate, not optional.
  postgres:
    # Custom-built from source (ADR-0016, swarm), pushed ONLY to the local
    # registry — it is not on the dockerhub.smile.fr mirror, unlike the other
    # images here (air-gap: rebuild + repush if this box ever needs re-mirroring).
    image: ${LOCAL_REGISTRY:-localhost:5000}/paradedb-pg16:0.24.1
    init: true
    command: ["postgres", "-c", "shared_preload_libraries=pg_search,pg_cron,pg_stat_statements"]
    environment:
      POSTGRES_USER: ${SWARM_DB_USER:-swarm}
      POSTGRES_PASSWORD: ${SWARM_DB_PASSWORD:-swarm}
      # Derived from SWARM_ENV (ADR-0015) — no hardcoded/defaulted name. An
      # explicit SWARM_DB_NAME still wins outright for a sandbox clone.
      POSTGRES_DB: ${SWARM_DB_NAME:-swarm_${SWARM_ENV:?SWARM_ENV must be set to test|staging|prod}}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "${SWARM_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SWARM_DB_USER:-swarm}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - hive_pgdata:/var/lib/postgresql/data

  # --- Schema migration (one-shot) ----------------------------------------
  # A release has no `mix ecto.migrate`; run migrations via the release `eval`
  # (Swarm.Release.migrate/0), then exit. The kernel waits for this to succeed.
  migrate:
    image: swarm-kernel:${SWARM_KERNEL_VERSION:-0.8.1}
    build:
      context: ../swarm/kernel
      args:
        HUB_REGISTRY: ${HUB_REGISTRY:-dockerhub.smile.fr}
        DHI_REGISTRY: ${DHI_REGISTRY:-dhi.smile.fr}
    init: true            # docker-init as PID 1 → reaps the BEAM's epmd child
    command: ["eval", "Swarm.Release.migrate()"]
    environment:
      SWARM_DB_HOST: postgres
      SWARM_DB_PORT: "5432"
      SWARM_DB_USER: ${SWARM_DB_USER:-swarm}
      SWARM_DB_PASSWORD: ${SWARM_DB_PASSWORD:-swarm}
      SWARM_DB_NAME: ${SWARM_DB_NAME:-swarm_${SWARM_ENV:?SWARM_ENV must be set to test|staging|prod}}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # --- Model runtime: Ollama (GPU), containerized in the stack --------------
  # Self-contained: no host Ollama, no host.docker.internal, no loosening the
  # host's network. GPU via the NVIDIA container runtime. The 238 GB of models
  # already on the host are mounted read-only — nothing is re-downloaded, and the
  # stack stays offline-capable. (Canon historically ran Ollama on the host; this
  # is the deployment instance's choice and is documented in hive.)
  ollama:
    image: ${HUB_REGISTRY:-dockerhub.smile.fr}/ollama/ollama:0.30.6@sha256:fbaaecc6c632a73c2b4ca25ef52dbee0b68d07783fcb850f916404c004040f90
    init: true
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # Consilium runs a parallel panel; raise the default cap (3) so the whole
      # fleet can stay GPU-resident. GB10 unified memory is the real limit, not this.
      OLLAMA_MAX_LOADED_MODELS: "6"
      OLLAMA_NUM_PARALLEL: "2"
    volumes:
      - ${OLLAMA_MODELS_DIR:-/usr/share/ollama/.ollama/models}:/root/.ollama/models:ro
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # --- Intelligence pillar: Python ML service (gRPC Embedder) -------------
  ml:
    image: swarm-ml:${SWARM_ML_VERSION:-0.2.0}
    init: true
    # Horizontal pillar (system_architecture §9): the ML service is stateless, so
    # it scales out. Compose DNS resolves `ml` to all replica IPs; the kernel
    # reconnects per call (Swarm.ML.Boundary), spreading load and surviving the
    # loss of any one replica. The GPU/Ollama behind them stays a singleton.
    deploy:
      replicas: 2
    build:
      context: ../swarm
      dockerfile: ml/Dockerfile
      args:
        HUB_REGISTRY: ${HUB_REGISTRY:-dockerhub.smile.fr}
        DHI_REGISTRY: ${DHI_REGISTRY:-dhi.smile.fr}
        UV_REGISTRY: ${UV_REGISTRY:-ghcr.io}
    environment:
      SWARM_ML_BIND: 0.0.0.0:50051
      # Reach the containerized Ollama over the compose network (never hardcode).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    depends_on:
      ollama:
        condition: service_healthy

  # --- Logic / coordination: Elixir kernel (Core API + graph + consilium) -
  kernel:
    image: swarm-kernel:${SWARM_KERNEL_VERSION:-0.8.1}
    init: true            # docker-init as PID 1 → reaps the BEAM's epmd child
    build:
      context: ../swarm/kernel
      args:
        HUB_REGISTRY: ${HUB_REGISTRY:-dockerhub.smile.fr}
        DHI_REGISTRY: ${DHI_REGISTRY:-dhi.smile.fr}
    environment:
      SWARM_DB_HOST: postgres
      SWARM_DB_PORT: "5432"
      # rls-app-role: the RUNTIME kernel may use a dedicated non-superuser role
      # (swarm_app) so the Postgres RLS belt is LIVE; postgres + migrate keep the
      # privileged role. Defaults preserve today's behavior — the operator flips by
      # setting SWARM_KERNEL_DB_USER=swarm_app + SWARM_KERNEL_DB_PASSWORD after
      # enabling login on the role (see docs/operations.md "RLS app role").
      SWARM_DB_USER: ${SWARM_KERNEL_DB_USER:-${SWARM_DB_USER:-swarm}}
      SWARM_DB_PASSWORD: ${SWARM_KERNEL_DB_PASSWORD:-${SWARM_DB_PASSWORD:-swarm}}
      SWARM_DB_NAME: ${SWARM_DB_NAME:-swarm_${SWARM_ENV:?SWARM_ENV must be set to test|staging|prod}}
      SWARM_ML_ADDRESS: ml:50051
      # Dev consilium fleet: small GPU-resident models so an escalated answer
      # returns in seconds, not minutes (this single-GPU box can't swap the heavy
      # default panel of 5 large models + a 70B judge fast enough). Unset these (or
      # override) for prod → the decorrelated heavy panel in swarm config.exs stands.
      # Capable models for real synthesis (the GB10's 128GB keeps them resident).
      # ADR-11 decorrelation applies to synthesized-answer judging too: the judge
      # must not be a panel member. qwen3:14b remains in the panel; gemma4:31b is
      # the conservative decorrelated judge until a smaller third-family judge wins
      # the contrastive-inversion eval.
      SWARM_CONSILIUM_PANEL: ${SWARM_CONSILIUM_PANEL:-qwen3:14b,lfm2.5:8b}
      SWARM_CONSILIUM_JUDGE: ${SWARM_CONSILIUM_JUDGE:-gemma4:31b}
      # Verified actor assertion (ADR-16 D9, step 6b): the SAME shared secret as
      # web_channel's SWARM_ACTOR_SECRET below, from secrets.env — unset here ⇒ the
      # kernel refuses to verify (fails closed), so signing simply has no effect
      # until an operator configures it on both sides. auth_mode stays the config
      # default (:dual) until the step-6b.7 cutover explicitly sets :strict.
      SWARM_ACTOR_SECRET: ${SWARM_ACTOR_SECRET:-}
      SWARM_AUTH_MODE: ${SWARM_AUTH_MODE:-strict}
      # ADR-17 tier-gate: serve covered asks from structure before the consilium. OFF unless
      # set "true" (a false-serve breaks trust — enable only after the go/no-go shows
      # false_serve_rate ~0; set in env/staging.env for the internal instance). Entail model
      # override optional (default qwen3:14b — fsr 0/recall 1 once sidecar thinking is disabled).
      SWARM_TIER_GATE_ENABLED: ${SWARM_TIER_GATE_ENABLED:-}
      SWARM_TIER_GATE_ENTAIL_MODEL: ${SWARM_TIER_GATE_ENTAIL_MODEL:-qwen3:14b}
      SWARM_TIER_GATE_NETWORK_SERVE: ${SWARM_TIER_GATE_NETWORK_SERVE:-}
      SWARM_TIER_GATE_NETWORK_MIN_CORROB: ${SWARM_TIER_GATE_NETWORK_MIN_CORROB:-}
      SWARM_TIER_GATE_WHO_SERVE: ${SWARM_TIER_GATE_WHO_SERVE:-}
      SWARM_TIER_GATE_TECHNOLOGY_SERVE: ${SWARM_TIER_GATE_TECHNOLOGY_SERVE:-}
      SWARM_TIER_GATE_TECHNOLOGY_MIN_CORROB: ${SWARM_TIER_GATE_TECHNOLOGY_MIN_CORROB:-}
      # Gate budget after semantic routing entered the live path: semantic embedding
      # runs before Stage 2, then Stage 2 gets this bounded entail window. Keep this
      # visible here so deploy and host-side measurements cannot drift silently.
      SWARM_TIER_GATE_BREAKER_MS: ${SWARM_TIER_GATE_BREAKER_MS:-7000}
      # Warm the pinned fleet at kernel start so the first browser ask after deploy
      # sees the steady-state path instead of paying cold-load inside the gate.
      SWARM_ML_PREWARM: ${SWARM_ML_PREWARM:-true}
      SWARM_ML_PREWARM_TIMEOUT_MS: ${SWARM_ML_PREWARM_TIMEOUT_MS:-120000}
      # Optional evidence-link templates. Real base URLs live in env/<stage>.env
      # because they are intranet instance facts; empty means plaintext citations.
      SWARM_CITATION_URL_TEMPLATE_CONFLUENCE: ${SWARM_CITATION_URL_TEMPLATE_CONFLUENCE:-}
      SWARM_CITATION_URL_TEMPLATE_MEDIAWIKI: ${SWARM_CITATION_URL_TEMPLATE_MEDIAWIKI:-}
    ports:
      - "${SWARM_CORE_API_PORT:-50061}:50061"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ml:
        condition: service_started

  # --- Plugin adapters (Tier B: out-of-process, gRPC over the port ABI) ---
  # Each plugin is a self-contained dir under ./plugins with its own Dockerfile,
  # vendored proto, and manifest. Polyglot by construction — Python, Go, etc.

  mediawiki_connector:
    image: conn-mediawiki:${CONN_MEDIAWIKI_VERSION:-0.1.0}
    profiles: ["jobs"]
    init: true
    build:
      context: ../conn-mediawiki
      args:
        HUB_REGISTRY: ${HUB_REGISTRY:-dockerhub.smile.fr}
        DHI_REGISTRY: ${DHI_REGISTRY:-dhi.smile.fr}
    environment:
      SWARM_CONNECTOR_PORT: "50071"
      WIKI_URL: ${WIKI_URL:-}
      WIKI_USER: ${WIKI_USER:-}
      WIKI_USER_TOKEN: ${WIKI_USER_TOKEN:-}
      WIKI_ALT_USERNAME: ${WIKI_ALT_USERNAME:-}
      WIKI_ALT_TOKEN: ${WIKI_ALT_TOKEN:-}
      WIKI_TLS_INSECURE: ${WIKI_TLS_INSECURE:-}

  mediawiki_ingest:
    image: swarm-kernel:${SWARM_KERNEL_VERSION:-0.8.3}
    profiles: ["jobs"]
    init: true
    build:
      context: ../swarm/kernel
      args:
        HUB_REGISTRY: ${HUB_REGISTRY:-dockerhub.smile.fr}
        DHI_REGISTRY: ${DHI_REGISTRY:-dhi.smile.fr}
    command:
      - eval
      - |
        {:ok, report} = Swarm.Connector.IngestRunner.run_from_env()
        %{rows: pending} =
          Swarm.Repo.query!("SELECT c.node_id FROM content c WHERE NOT EXISTS (SELECT 1 FROM chunk k WHERE k.node_id = c.node_id)")
        total = length(pending)
        conc = String.to_integer(System.get_env("EMBED_CONC", "4"))
        {ok, failed} =
          pending
          |> Task.async_stream(fn [id] -> Swarm.Ingest.Content.embed(id, []) end,
            max_concurrency: conc,
            timeout: 120_000,
            on_timeout: :kill_task
          )
          |> Enum.reduce({0, 0}, fn
            {:ok, {:ok, _}}, {o, f} -> {o + 1, f}
            _, {o, f} -> {o, f + 1}
          end)
        IO.puts("mediawiki_connector_ingest.report=" <> inspect(report))
        IO.puts("mediawiki_connector_ingest.embed pending=#{total} ok=#{ok} failed=#{failed}")
        if report.complete? and failed == 0, do: :ok, else: System.halt(1)
    environment:
      SWARM_DB_HOST: postgres
      SWARM_DB_PORT: "5432"
      SWARM_DB_USER: ${SWARM_DB_USER:-swarm}
      SWARM_DB_PASSWORD: ${SWARM_DB_PASSWORD:-swarm}
      SWARM_DB_NAME: ${SWARM_DB_NAME:-swarm_${SWARM_ENV:?SWARM_ENV must be set to test|staging|prod}}
      SWARM_ML_ADDRESS: ml:50051
      SWARM_CONNECTOR_ADDRESS: mediawiki_connector:50071
      SWARM_CORE_API_START_SERVER: "false"
      SWARM_ML_PREWARM: "false"
      WIKI_SOURCE_ID: ${WIKI_SOURCE_ID:-}
      WIKI_MAXPAGES: ${WIKI_MAXPAGES:-30}
      WIKI_GAPLIMIT: ${WIKI_GAPLIMIT:-50}
      EMBED_CONC: ${EMBED_CONC:-4}
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_started
      mediawiki_connector:
        condition: service_started

  confluence_connector:
    image: conn-confluence:${CONN_CONFLUENCE_VERSION:-0.1.0}
    profiles: ["jobs"]
    init: true
    build:
      context: ../conn-confluence
      args:
        HUB_REGISTRY: ${HUB_REGISTRY:-dockerhub.smile.fr}
        DHI_REGISTRY: ${DHI_REGISTRY:-dhi.smile.fr}
    environment:
      SWARM_CONNECTOR_PORT: "50072"
      CONFLUENCE_URL: ${CONFLUENCE_URL:-}
      CONFLUENCE_USER: ${CONFLUENCE_USER:-}
      CONFLUENCE_TOKEN: ${CONFLUENCE_TOKEN:-}
      CONFLUENCE_TLS_INSECURE: ${CONFLUENCE_TLS_INSECURE:-}

  confluence_ingest:
    image: swarm-kernel:${SWARM_KERNEL_VERSION:-0.8.3}
    profiles: ["jobs"]
    init: true
    build:
      context: ../swarm/kernel
      args:
        HUB_REGISTRY: ${HUB_REGISTRY:-dockerhub.smile.fr}
        DHI_REGISTRY: ${DHI_REGISTRY:-dhi.smile.fr}
    command:
      - eval
      - |
        {:ok, _} = Application.ensure_all_started(:swarm)
        scope =
          case System.get_env("CONF_SOURCE_ID") do
            v when v in [nil, ""] -> Swarm.Projects.scope_by_kind!("confluence")
            source_id -> Swarm.Projects.scope!(source_id)
          end
        int = fn name, default ->
          case System.get_env(name) do
            v when v in [nil, ""] -> default
            v -> String.to_integer(v)
          end
        end
        opts = [
          address: System.fetch_env!("SWARM_CONNECTOR_ADDRESS"),
          scope: scope,
          max_pages: int.("CONF_MAXPAGES", 30),
          limit: int.("CONF_LIMIT", 50)
        ]
        opts =
          case System.get_env("CONF_SPACE") do
            v when v in [nil, ""] -> opts
            space -> Keyword.put(opts, :space, space)
          end
        {:ok, report} = Swarm.Connector.IngestRunner.run(opts)
        %{rows: pending} =
          Swarm.Repo.query!("SELECT c.node_id FROM content c WHERE NOT EXISTS (SELECT 1 FROM chunk k WHERE k.node_id = c.node_id)")
        total = length(pending)
        conc = String.to_integer(System.get_env("EMBED_CONC", "4"))
        {ok, failed} =
          pending
          |> Task.async_stream(fn [id] -> Swarm.Ingest.Content.embed(id, []) end,
            max_concurrency: conc,
            timeout: 120_000,
            on_timeout: :kill_task
          )
          |> Enum.reduce({0, 0}, fn
            {:ok, {:ok, _}}, {o, f} -> {o + 1, f}
            _, {o, f} -> {o, f + 1}
          end)
        IO.puts("confluence_connector_ingest.report=" <> inspect(report))
        IO.puts("confluence_connector_ingest.embed pending=#{total} ok=#{ok} failed=#{failed}")
        if report.complete? and failed == 0, do: :ok, else: System.halt(1)
    environment:
      SWARM_DB_HOST: postgres
      SWARM_DB_PORT: "5432"
      SWARM_DB_USER: ${SWARM_DB_USER:-swarm}
      SWARM_DB_PASSWORD: ${SWARM_DB_PASSWORD:-swarm}
      SWARM_DB_NAME: ${SWARM_DB_NAME:-swarm_${SWARM_ENV:?SWARM_ENV must be set to test|staging|prod}}
      SWARM_ML_ADDRESS: ml:50051
      SWARM_CONNECTOR_ADDRESS: confluence_connector:50072
      SWARM_CORE_API_START_SERVER: "false"
      SWARM_ML_PREWARM: "false"
      CONF_SOURCE_ID: ${CONF_SOURCE_ID:-}
      CONF_MAXPAGES: ${CONF_MAXPAGES:-30}
      CONF_LIMIT: ${CONF_LIMIT:-50}
      CONF_SPACE: ${CONF_SPACE:-}
      EMBED_CONC: ${EMBED_CONC:-4}
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_started
      confluence_connector:
        condition: service_started

  # --- Proxmox (ADR-21 slice 3): one connector image, one scheduled ingest job PER SITE.
  # The site key is data: it qualifies every fact's identity, so the connector receives every
  # configured site's variables and the job names ONE site (PROXMOX_SITE). A site listed in
  # PROXMOX_SITES without its three variables is a fatal startup error in the image, never a
  # silent skip. Read-only PVEAuditor tokens; TLS verified, an internal root ADDED via
  # PROXMOX_CA_PEM (a host path in secrets.env, mounted read-only), never disabled.
  proxmox_connector:
    image: conn-proxmox:${CONN_PROXMOX_VERSION:-0.1.0}
    profiles: ["jobs"]
    init: true
    build:
      context: ../conn-proxmox
      args:
        HUB_REGISTRY: ${HUB_REGISTRY:-dockerhub.smile.fr}
        DHI_REGISTRY: ${DHI_REGISTRY:-dhi.smile.fr}
    environment:
      SWARM_CONNECTOR_PORT: "50073"
      PROXMOX_SITES: ${PROXMOX_SITES:-}
      PROXMOX_FORGE_URL: ${PROXMOX_FORGE_URL:-}
      PROXMOX_FORGE_TOKEN_ID: ${PROXMOX_FORGE_TOKEN_ID:-}
      PROXMOX_FORGE_TOKEN_SECRET: ${PROXMOX_FORGE_TOKEN_SECRET:-}
      PROXMOX_GALAXY_URL: ${PROXMOX_GALAXY_URL:-}
      PROXMOX_GALAXY_TOKEN_ID: ${PROXMOX_GALAXY_TOKEN_ID:-}
      PROXMOX_GALAXY_TOKEN_SECRET: ${PROXMOX_GALAXY_TOKEN_SECRET:-}
      PROXMOX_IDF_URL: ${PROXMOX_IDF_URL:-}
      PROXMOX_IDF_TOKEN_ID: ${PROXMOX_IDF_TOKEN_ID:-}
      PROXMOX_IDF_TOKEN_SECRET: ${PROXMOX_IDF_TOKEN_SECRET:-}
      PROXMOX_CASA_URL: ${PROXMOX_CASA_URL:-}
      PROXMOX_CASA_TOKEN_ID: ${PROXMOX_CASA_TOKEN_ID:-}
      PROXMOX_CASA_TOKEN_SECRET: ${PROXMOX_CASA_TOKEN_SECRET:-}
      PROXMOX_TLS_VERIFY: ${PROXMOX_TLS_VERIFY:-true}
      # Inside the container the anchor is always at this path; empty when no PEM is configured.
      PROXMOX_CA_PEM: ${PROXMOX_CA_PEM:+/certs/proxmox-root-ca.pem}
    volumes:
      - ${PROXMOX_CA_PEM:-/dev/null}:/certs/proxmox-root-ca.pem:ro

  proxmox_ingest:
    image: swarm-kernel:${SWARM_KERNEL_VERSION:-0.8.3}
    profiles: ["jobs"]
    init: true
    build:
      context: ../swarm/kernel
      args:
        HUB_REGISTRY: ${HUB_REGISTRY:-dockerhub.smile.fr}
        DHI_REGISTRY: ${DHI_REGISTRY:-dhi.smile.fr}
    command:
      - eval
      - |
        {:ok, _} = Application.ensure_all_started(:swarm)
        site =
          case System.get_env("PROXMOX_SITE") do
            v when v in [nil, ""] -> raise "PROXMOX_SITE is required: one ingest job per site"
            v -> v
          end
        scope =
          case System.get_env("PROXMOX_SOURCE_ID") do
            v when v in [nil, ""] -> Swarm.Projects.scope_by_kind!("proxmox")
            source_id -> Swarm.Projects.scope!(source_id)
          end
        started = DateTime.utc_now()
        {:ok, report} =
          Swarm.Connector.IngestRunner.run(
            address: System.fetch_env!("SWARM_CONNECTOR_ADDRESS"),
            scope: scope,
            site: site
          )
        # Closure by absence is gated on a COMPLETE run: a failed fetch must never read as a
        # datacenter emptying out. as_of = the run's latest observation instant.
        absent =
          if report.complete? do
            {:ok, n} =
              Swarm.Graph.Temporal.reconcile_absent("proxmox:" <> site, started, report.watermark || started)
            n
          else
            :skipped_incomplete
          end
        IO.puts("proxmox_connector_ingest.site=#{site} report=" <> inspect(report) <> " absent_closed=" <> inspect(absent))
        if report.complete?, do: :ok, else: System.halt(1)
    environment:
      SWARM_DB_HOST: postgres
      SWARM_DB_PORT: "5432"
      SWARM_DB_USER: ${SWARM_DB_USER:-swarm}
      SWARM_DB_PASSWORD: ${SWARM_DB_PASSWORD:-swarm}
      SWARM_DB_NAME: ${SWARM_DB_NAME:-swarm_${SWARM_ENV:?SWARM_ENV must be set to test|staging|prod}}
      SWARM_ML_ADDRESS: ml:50051
      SWARM_CONNECTOR_ADDRESS: proxmox_connector:50073
      SWARM_CORE_API_START_SERVER: "false"
      SWARM_ML_PREWARM: "false"
      PROXMOX_SITE: ${PROXMOX_SITE:-}
      PROXMOX_SOURCE_ID: ${PROXMOX_SOURCE_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      proxmox_connector:
        condition: service_started

  # --- Channel: web_channel (FastAPI/HTMX operator console) ----------------
  # First Tier-B plugin: an out-of-process gRPC CLIENT of the Core API. It speaks
  # exactly the contract cli_channel speaks and NEVER reads the graph DB (ADR-1
  # hive). P0 = channel-only (Ask), fixed operator, public scope; auth is P1.
  web_channel:
    image: web-channel:0.1.0
    init: true
    build:
      context: ./plugins/web_channel
      args:
        DHI_REGISTRY: ${DHI_REGISTRY:-dhi.smile.fr}
        UV_REGISTRY: ${UV_REGISTRY:-ghcr.io}
    environment:
      # Reach the kernel Core API over the compose network (never hardcode a host).
      SWARM_CORE_ADDR: kernel:50061
      # --- P1 identity: Keycloak OIDC. When OIDC_ENABLED, /ask requires login and
      # viewer+scopes come from the token; when off, the P0 fixed-operator path runs.
      OIDC_ENABLED: "true"
      SWARM_VIEWER: ${WEB_CHANNEL_VIEWER:-operator}   # fallback identity only when OIDC is off
      # Browser-reachable issuer (same URL the browser and this container use, so the
      # token `iss` is consistent). No safe generic default exists (it must be a real,
      # externally-resolvable hostname for the split-horizon trick below to work) — set
      # KEYCLOAK_PUBLIC_URL in env/staging.env (gitignored; not a credential, but
      # intranet-specific, so it never gets committed). Swap to the org's real SSO
      # realm via the same var + KEYCLOAK_REALM.
      OIDC_ISSUER: ${KEYCLOAK_PUBLIC_URL:?set in env/staging.env, e.g. http://<your-host>:8081}/realms/${KEYCLOAK_REALM:-swarm-local}
      OIDC_CLIENT_ID: ${WEB_CHANNEL_OIDC_CLIENT_ID:-web_channel}
      OIDC_CLIENT_SECRET: ${WEB_CHANNEL_OIDC_SECRET:-web-channel-local-dev-secret-CHANGE-IN-PROD}
      WEB_CHANNEL_BASE_URL: ${WEB_CHANNEL_PUBLIC_URL:?set in env/staging.env, e.g. http://<your-host>:8080}
      # No committed signing key: empty ⇒ the app mints a random ephemeral key
      # (sessions reset on restart). Set WEB_CHANNEL_SESSION_SECRET (secrets.env) to persist.
      SESSION_SECRET: ${WEB_CHANNEL_SESSION_SECRET:-}
      # ADR-20: scopes and capabilities are kernel-derived (Project membership, fixed groups,
      # elevation) — the channel carries no group→scope map / baseline / scope-picker config.
      # Admin API for the groot invite/provision (server-to-server, internal URL).
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-swarm-local}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Durable conversation log + local credential store (private, on the volume below).
      WEB_CHANNEL_DB: /app/data/web_channel.db
      # Body telemetry (the footer): the glances sidecar's REST API, compose-internal.
      GLANCES_ADDR: http://glances:61208
      # Verified actor assertion (ADR-16 D9, step 6b): signs the HS256 assertion the
      # kernel verifies. MUST equal the kernel's SWARM_ACTOR_SECRET above (same
      # secret, both from secrets.env — never committed). Unset ⇒ signing is a no-op
      # (pre-rollout dev; the pre-6b legacy plaintext-viewer path is unaffected).
      SWARM_ACTOR_SECRET: ${SWARM_ACTOR_SECRET:-}
    extra_hosts:
      # Reach the host-published Keycloak port at the same hostname the browser uses,
      # so the OIDC issuer is identical server-side and browser-side (dev split-horizon).
      # Same var as KEYCLOAK_PUBLIC_URL's host — set in env/staging.env. (Verified: Docker
      # will NOT reliably let this be "localhost" — the container's own baked-in
      # 127.0.0.1 localhost entry wins over an extra_hosts override, so that specific
      # value silently fails the split-horizon trick; use a real, distinct hostname.)
      - "${KEYCLOAK_PUBLIC_HOST:?set in env/staging.env, e.g. your-host.example}:host-gateway"
    ports:
      - "${WEB_CHANNEL_PORT:-8080}:8080"
    volumes:
      # Private, persistent: conversation log + local users. Never committed.
      - web_channel_data:/app/data
    depends_on:
      kernel:
        condition: service_started

  # --- Body telemetry: Glances (htop-family) as a REST data source ----------
  # Feeds web_channel's footer strip ("state of my body": CPU/RAM/load/procs/GPU).
  # `pid: host` = host-wide READ-ONLY observation; deliberately NO docker.sock
  # (the socket grants full docker API control even mounted ro — least privilege).
  # API stays compose-internal (no published port); GPU stats via NVML like ollama.
  glances:
    # ubuntu variant, NOT alpine: the toolkit-injected NVML is a glibc library —
    # musl's loader can't dlopen it (verified live: LibraryNotFound on alpine).
    image: ${HUB_REGISTRY:-dockerhub.smile.fr}/nicolargo/glances:ubuntu-latest-full
    init: true
    pid: host
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
      GLANCES_OPT: "-w --disable-webui"
    # The toolkit injects only the fully-versioned libnvidia-ml.so.<ver> on this host
    # (no .so.1 symlink, no ldconfig run), and pynvml loads "libnvidia-ml.so.1" —
    # link it before exec (same python/glances invocation as the image's own CMD).
    command:
      - /bin/sh
      - -c
      - |
        for f in /usr/lib/aarch64-linux-gnu/libnvidia-ml.so.*.*; do
          ln -sf "$$f" /usr/lib/aarch64-linux-gnu/libnvidia-ml.so.1; break
        done
        exec /venv/bin/python$${PYTHON_VERSION} -m glances $${GLANCES_OPT}
    restart: unless-stopped

  # --- Identity: local Keycloak (OIDC) — P1 dev login mechanism ------------
  # Mirrors the org's real Keycloak (KC 26.6.1, DHI image, OIDC + groups mapper) so the
  # channel config is swap-able to a real realm via config alone (operator; never a
  # hardcoded realm URL here). Dev-mode (start-dev), realm imported from the committed
  # export. Admin + client secret come from env (dev defaults here; real values via
  # secrets.env in prod). The realm export is a .json.tpl (hive-publish-readiness-audit):
  # its redirect-URI host is a placeholder, sed-substituted from KEYCLOAK_PUBLIC_HOST at
  # container start (no envsubst in this DHI image — verified sed+sh are present) so the
  # real hostname lives only in the gitignored env/staging.env, never in a committed
  # file. KEYCLOAK_PUBLIC_HOST
  # is passed via `environment:` and read as a shell var ($$-escaped from Compose's own
  # interpolation), NOT spliced into the command string at compose-parse time — council
  # (codex) caught that the earlier draft interpolated it directly into the shell command
  # text, which is a real (if operator-controlled, low-likelihood) injection surface; a
  # host-charset guard rejects anything but [A-Za-z0-9.-] before the sed runs.
  keycloak:
    image: ${DHI_REGISTRY:-dhi.smile.fr}/keycloak:26.6.1-debian13
    init: true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        case "$$KEYCLOAK_PUBLIC_HOST" in
          *[!A-Za-z0-9.-]*|'') echo "KEYCLOAK_PUBLIC_HOST must be a bare hostname (got '$$KEYCLOAK_PUBLIC_HOST')" >&2; exit 1;;
        esac &&
        mkdir -p /opt/keycloak/data/import &&
        sed "s|__KEYCLOAK_PUBLIC_HOST__|$$KEYCLOAK_PUBLIC_HOST|g"
        /tmp/realm-swarm-local.json.tpl > /opt/keycloak/data/import/realm.json &&
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      KEYCLOAK_PUBLIC_HOST: ${KEYCLOAK_PUBLIC_HOST:?set in env/staging.env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./plugins/web_channel/keycloak/realm-swarm-local.json.tpl:/tmp/realm-swarm-local.json.tpl:ro
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"

