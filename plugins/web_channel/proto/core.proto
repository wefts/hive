// VENDORED COPY of swarm/proto/core.proto (the kernel's published Core API wire
// contract, package swarm.core.v1). The canonical source is `swarm/proto/core.proto`
// in the public kernel repo; this copy exists only so the Docker build context
// (the plugin dir) is self-contained. Refresh it with `scripts/gen-proto.sh`,
// which copies the canonical proto over this file before generating stubs.
// DO NOT hand-edit — edit the canonical proto in swarm/ and re-run the script.
syntax = "proto3";

// The kernel's outward Core API — the single contract a Channel adapter (CLI,
// web, chat) speaks to. The kernel owns cognition and the single-voice rule
// (Domain 11); a channel only renders and accepts input.
package swarm.core.v1;

service Core {
  // Ask a question: routed through the gate, answered by tier-tools or the
  // consilium, returned with citations and confidence (the single voice).
  rpc Ask(AskRequest) returns (AskResponse);
  // Knowledge-base health (graph size + embedding-namespace stamps).
  rpc KbStatus(StatusRequest) returns (StatusResponse);
  // Retrieval over the graph, scope-filtered.
  rpc KbSearch(SearchRequest) returns (SearchResponse);
  // The panel-vs-judge deliberation behind a past escalated answer, by ask_ref
  // (ADR-15). Read-only, retained, returned only to the owning viewer within scope.
  rpc Deliberation(DeliberationRequest) returns (DeliberationResponse);
  // A bounded, scope-filtered neighborhood around one node: nodes + typed edges
  // (ADR-15). The "connections" surface — never the full hairball.
  rpc Neighborhood(NeighborhoodRequest) returns (NeighborhoodResponse);
  // Worker/job activity as a polled, scope-safe typed event log with an OPAQUE
  // cursor (ADR-15). Poll, not stream; no raw sequence on the wire — the kernel
  // skips out-of-scope events server-side so hidden volume/timing is not inferable.
  rpc ActivityFeed(ActivityFeedRequest) returns (ActivityFeedResponse);

  // --- Identity / privacy (workspace ADR-16) -------------------------------
  // These carry a SIGNED actor assertion (the Swarm.Actor HS256 wire contract),
  // NOT a plaintext viewer: the kernel verifies it and DERIVES {uuid,scopes,caps}
  // from its own records (Decision 9). They are strict — an absent/invalid
  // assertion is UNAUTHENTICATED — even while the older RPCs above still dual-accept
  // a legacy plaintext `viewer` during the channel migration (step 6b).

  // Verify a signed assertion and return the derived actor. The channel calls this
  // once at login to learn its {uuid,scopes,caps}; also the auth self-test.
  rpc ResolveActor(ResolveActorRequest) returns (ResolveActorResponse);
  // JIT-provision a NEW (or re-syncing) SSO subject (ADR-16 D3). The ENTIRE claim
  // set (login/names/email/groups) rides INSIDE the signed provision token
  // (aud "swarm.provision.v1") — nothing authority-bearing is a plain request
  // field (council: codex+gemini — unsigned groups would be self-asserted scopes).
  rpc ProvisionActor(ProvisionActorRequest) returns (ResolveActorResponse);
  // Log one conversation turn (creates the conversation if conversation_id is empty;
  // otherwise appends to one the actor owns). Owner = the verified subject.
  rpc LogConversation(LogConversationRequest) returns (LogConversationResponse);
  // The actor's own conversations (owner-private; never another user's).
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  // One conversation the actor owns, with its messages; NOT_FOUND otherwise
  // (404-not-403: not-owned and non-existent are indistinguishable).
  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse);
  // Break-glass: a superadmin reads another user's conversation by impersonating the
  // owner through the same predicate, audited-before-return (Decision 6). Superadmin
  // + read_any_conversation only; NOT_AUTHORIZED otherwise.
  rpc AdminReadConversation(AdminReadConversationRequest) returns (GetConversationResponse);
  // Admin-mutable access management (grant/revoke role or group, set group scopes),
  // capability-gated + audited (Decision 10). Role grants are superadmin-only.
  rpc ManageAccess(ManageAccessRequest) returns (AdminActionResponse);
  // User lifecycle: invite / deactivate / delete, capability-gated + audited
  // (Decision 11). Deactivate/delete kill the login; learned content persists.
  rpc ManageUser(ManageUserRequest) returns (AdminActionResponse);

  // The kernel-truth user roster for an admin console (ADR-16; admin-cleanup epic).
  // Allowed for ANY of {invite_users, manage_users, manage_access} — the list is
  // prerequisite data for all three workflows (council: codex+gemini agreed).
  // Success is NOT audited (a roster read on every admin page load would drown
  // admin_action_audit); DENIALS are audited like every other admin op.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // One user's full view for the detail page — avoids scanning the roster at scale.
  // Same admin-cap gate as ListUsers; NOT_FOUND for an unknown/tombstoned uuid.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  // Read-only group list for the admin console (E3-read). Any admin cap.
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
  // Read-only role list with derived capabilities + holder counts. Any admin cap.
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc ManageGroup(ManageGroupRequest) returns (AdminActionResponse);
  // One group with its MEMBERS (login + providers), for the group detail page
  // (ADR-19). Any admin cap; NOT_FOUND for an unknown group.
  rpc GetGroup(GetGroupRequest) returns (GetGroupResponse);
  // Incoming-SSO-group → our-group mapping (ADR-18 ps-4; Auth Provider UI). Read
  // + CRUD, `manage_access`-gated + audited. Default-deny stays — an unmapped
  // incoming group grants nothing; the mapping only routes to an existing group.
  rpc ListSsoMap(ListSsoMapRequest) returns (ListSsoMapResponse);
  rpc ManageSsoMap(ManageSsoMapRequest) returns (AdminActionResponse);
}

// Outcome of an identity/privacy call. UNAUTHENTICATED (no/invalid assertion) is
// distinct from NOT_AUTHORIZED (valid actor, lacks the capability) and NOT_FOUND
// (404-not-403 — no existence oracle).
enum CallStatus {
  CALL_STATUS_UNSPECIFIED = 0;
  CALL_OK = 1;
  CALL_NOT_FOUND = 2;
  CALL_UNAUTHENTICATED = 3;
  CALL_NOT_AUTHORIZED = 4;
  CALL_BAD_REQUEST = 5; // malformed input (bad role, empty/dup login, missing reason)
}

message ResolveActorRequest {
  string assertion = 1; // signed HS256 actor assertion (Swarm.Actor wire contract)
}

message ProvisionActorRequest {
  // A signed HS256 provision token: aud "swarm.provision.v1", payload
  // {sub, provider, login, first_name?, last_name?, nickname?, email?,
  //  groups[], iat, exp<=300s}. Same shared secret as the actor assertion;
  // the distinct audience prevents cross-use (an actor assertion cannot
  // provision, a provision token cannot act).
  string provision = 1;
}

message ResolveActorResponse {
  CallStatus status = 1;         // OK | UNAUTHENTICATED
  string uuid = 2;               // the derived, verified subject uuid
  repeated string scopes = 3;    // DERIVED from the store (never the token)
  repeated string caps = 4;      // DERIVED capabilities (default-deny)
  string login = 5;
}

message ConversationView {
  string id = 1;
  string owner_id = 2;
  string scope = 3;       // usually empty (owner-private)
  string title = 4;
  string created_at = 5;  // ISO-8601
  string updated_at = 6;
}

message MessageView {
  string id = 1;
  string role = 2;              // "user" | "assistant"
  string body = 3;
  string author_user_id = 4;    // may be empty
  string ask_ref = 5;           // link to a retained deliberation; may be empty
  string created_at = 6;        // ISO-8601
}

message LogConversationRequest {
  string assertion = 1;
  string conversation_id = 2;   // empty ⇒ create a new conversation (using title)
  string title = 3;
  string role = 4;              // "user" | "assistant"
  string body = 5;
  string ask_ref = 6;
}

message LogConversationResponse {
  CallStatus status = 1;        // OK | NOT_FOUND (conversation not owned) | UNAUTHENTICATED
  string conversation_id = 2;
  string message_id = 3;
}

message ListConversationsRequest {
  string assertion = 1;
}

message ListConversationsResponse {
  CallStatus status = 1;                       // OK | UNAUTHENTICATED
  repeated ConversationView conversations = 2; // the actor's own, newest first
}

message GetConversationRequest {
  string assertion = 1;
  string conversation_id = 2;
}

message GetConversationResponse {
  CallStatus status = 1;                 // OK | NOT_FOUND | UNAUTHENTICATED | NOT_AUTHORIZED
  ConversationView conversation = 2;
  repeated MessageView messages = 3;
}

message AdminReadConversationRequest {
  string assertion = 1;
  string conversation_id = 2;
  string reason = 3;             // recorded in the audit trail
}

enum AccessOp {
  ACCESS_OP_UNSPECIFIED = 0;
  GRANT_ROLE = 1;       // superadmin-only
  REVOKE_ROLE = 2;      // superadmin-only
  GRANT_GROUP = 3;      // manage_access
  REVOKE_GROUP = 4;     // manage_access
  SET_GROUP_SCOPES = 5; // manage_access
}

message ManageAccessRequest {
  string assertion = 1;
  AccessOp op = 2;
  string target_user_id = 3;     // role/group ops
  string role = 4;               // "admin" | "superadmin"
  string group_id = 5;
  repeated string scopes = 6;    // SET_GROUP_SCOPES
}

enum UserOp {
  USER_OP_UNSPECIFIED = 0;
  INVITE = 1;      // invite_users
  DEACTIVATE = 2;  // manage_users
  DELETE = 3;      // manage_users
}

message ManageUserRequest {
  string assertion = 1;
  UserOp op = 2;
  string target_user_id = 3;     // deactivate / delete
  string login = 4;              // invite
  string first_name = 5;
  string last_name = 6;
  string nickname = 7;
}

message ListUsersRequest {
  string assertion = 1;
  // Tombstones (status=deleted) are EXCLUDED by default — normal operator
  // workflows must not act on deleted identities (council). Explicit opt-in only.
  bool include_deleted = 2;
  // Bounded by contract (council: gemini's must-fix): server clamps to [1..500];
  // 0 means the server default (500). Deterministic order: login, id.
  int32 limit = 3;
  // Case-insensitive substring over login + first/last/nickname (server-side ILIKE).
  string query = 4;
  // Page offset (>= 0); clamped to >= 0 by the server. limit stays the page size.
  int32 offset = 5;
}

message UserView {
  string id = 1;                 // the kernel uuid — what ManageUser/ManageAccess target
  string login = 2;
  string first_name = 3;
  string last_name = 4;
  string nickname = 5;
  string status = 6;             // invited | active | disabled | deleted
  repeated string roles = 7;     // admin | superadmin
  repeated string groups = 8;
  repeated string providers = 9; // identity_link providers (keycloak | local | …)
  string last_login_at = 10;     // ISO8601, "" when never
  repeated string emails = 11;   // admin-visible PII; populated ONLY by GetUser
}

message ListUsersResponse {
  CallStatus status = 1;
  repeated UserView users = 2;
  // Count of rows matching the filter, BEFORE limit/offset — for the pager.
  int32 total = 3;
}

message GetUserRequest {
  string assertion = 1;
  string user_id = 2;
}

message GetUserResponse {
  CallStatus status = 1;   // OK | NOT_FOUND | NOT_AUTHORIZED | UNAUTHENTICATED
  UserView user = 2;
}

message ListGroupsRequest { string assertion = 1; }

message GroupView {
  string id = 1;
  int32 member_count = 2;
  repeated string granted_scopes = 3;
  repeated string granted_roles = 4; // stays [] until a group->role binding exists (forward-compat)
  string name = 5;
  string description = 6;
}

message ListGroupsResponse {
  CallStatus status = 1;             // OK | NOT_AUTHORIZED | UNAUTHENTICATED
  repeated GroupView groups = 2;
}

message GetGroupRequest {
  string assertion = 1;
  string group_id = 2;
}

message GroupMember {
  string user_id = 1;
  string login = 2;
  repeated string providers = 3; // identity_link providers (local | keycloak | …)
  string status = 4;             // invited | active | disabled
}

message GetGroupResponse {
  CallStatus status = 1;          // OK | NOT_FOUND | NOT_AUTHORIZED | UNAUTHENTICATED
  GroupView group = 2;
  repeated GroupMember members = 3; // ordered by login
}

message ListRolesRequest { string assertion = 1; }

message RoleView {
  string name = 1;
  repeated string capabilities = 2;
  int32 holder_count = 3;
}

message ListRolesResponse {
  CallStatus status = 1;             // OK | NOT_AUTHORIZED | UNAUTHENTICATED
  repeated RoleView roles = 2;
}

enum GroupOp {
  GROUP_OP_UNSPECIFIED = 0;
  GROUP_CREATE = 1;      // manage_access
  GROUP_RENAME = 2;      // manage_access
  GROUP_DELETE = 3;      // manage_access; non-empty needs confirm
  GROUP_SET_ROLE = 4;    // superadmin (privilege)
  GROUP_CLEAR_ROLE = 5;  // superadmin
  GROUP_SET_SCOPES = 6;  // manage_access
}

message ManageGroupRequest {
  string assertion = 1;
  GroupOp op = 2;
  string group_id = 3;
  string name = 4;             // CREATE/RENAME
  string description = 5;      // CREATE (optional)
  string role = 6;             // SET_ROLE/CLEAR_ROLE ("admin"|"superadmin")
  repeated string scopes = 7;  // SET_SCOPES (src:* / public; never private)
  bool confirm = 8;            // DELETE of a non-empty group
}

message AdminActionResponse {
  CallStatus status = 1;         // OK | NOT_AUTHORIZED | UNAUTHENTICATED
  string user_id = 2;            // set on INVITE (the created user's uuid)
}

message ListSsoMapRequest { string assertion = 1; }

message SsoMapView {
  string provider = 1;        // the SSO provider (e.g. "keycloak")
  string incoming_group = 2;  // the group/role name as it arrives in the SSO claim
  string our_group_id = 3;    // the kernel access-group it maps to
}

message ListSsoMapResponse {
  CallStatus status = 1;              // OK | NOT_AUTHORIZED | UNAUTHENTICATED
  repeated SsoMapView mappings = 2;   // ordered by provider, incoming_group
}

enum SsoMapOp {
  SSO_MAP_OP_UNSPECIFIED = 0;
  SSO_MAP_PUT = 1;     // manage_access; upsert (provider,incoming_group)→our_group_id
  SSO_MAP_DELETE = 2;  // manage_access; remove (provider,incoming_group)
}

message ManageSsoMapRequest {
  string assertion = 1;
  SsoMapOp op = 2;
  string provider = 3;
  string incoming_group = 4;
  string our_group_id = 5;   // PUT only; must be an existing group (else BAD_REQUEST)
}

message AskRequest {
  string query = 1;
  // Allowed visibility scopes for this context (default-deny; empty ⇒ nothing).
  repeated string scopes = 2;
  // The asker's resolved identity (T8 / P11). The CHANNEL maps a platform user to
  // this canonical id (a deployment fact); the kernel uses it to resolve "my X"
  // and to scope. Empty ⇒ anonymous (a first-person query is then limited).
  string viewer = 3;
  // Conversational memory (chat-thread epic 2, hive/docs/design/chat-thread-ui.md):
  // entity KEYS the previous turn's AskResponse.citations already resolved
  // (non-claim citations' `ref` IS the graph node key — the channel echoes them
  // back here, no new extraction work). Folded into the world-map tier-gate's
  // candidate keys so a pronoun follow-up ("its dependencies?") can still hit the
  // fast structured-serve path — deliberately NOT resolved via an LLM rewrite (a
  // bogus/foreign-scoped key here simply fails to match real structure; the gate's
  // existing scope/evidence checks are the only validation, so this adds no new
  // no-leak surface). Empty ⇒ unchanged behavior.
  repeated string active_keys = 4;
  // Optional kernel-owned conversation to draw recent history from (ADR-16) — used
  // ONLY on the escalate/consilium path (an LLM call is already being paid for
  // there); owner-enforced via the SAME `Swarm.Conversations` predicate as
  // `GetConversation` — a `viewer` that doesn't own it (or isn't a real actor
  // uuid) silently yields no history, never an error or a leak. Empty ⇒ no history.
  string conversation_id = 5;
}

message Citation {
  string source = 1;
  string ref = 2;
  double confidence = 3;
}

// Answer-result algebra (T6): the typed outcome of a lookup. NOT_FOUND (no such
// item) is distinct from ERROR (transport/adapter failure) and from PARTIAL
// (some sources failed) — a not-found must never masquerade as an outage.
enum AnswerStatus {
  ANSWER_STATUS_UNSPECIFIED = 0;
  FOUND = 1;
  NOT_FOUND = 2;
  PARTIAL = 3;
  ERROR = 4;
}

message AskResponse {
  string answer = 1;
  double confidence = 2;
  string tier = 3;
  repeated Citation citations = 4;
  AnswerStatus status = 5;
  // Opaque handle to the retained panel-vs-judge deliberation (ADR-15), set ONLY
  // when an escalation produced one for a non-anonymous asker; empty otherwise.
  // The channel shows a "see the thinking" affordance only when it is present.
  string ask_ref = 6;
}

message StatusRequest {}

message NamespaceStamp {
  string namespace = 1;
  string model = 2;
  uint32 dim = 3;
  string status = 4;
}

// Per-node-type inventory: how many of each kind the system knows (T8 self-model).
message TypeCount {
  string type = 1;
  int64 count = 2;
}

message StatusResponse {
  int64 nodes = 1;
  int64 edges = 2;
  repeated NamespaceStamp namespaces = 3;
  // Self-model (T8): per-type inventory, last write activity (ISO-8601), and live
  // capabilities (attached connectors + the consilium panel) — all from real state.
  repeated TypeCount inventory = 4;
  string last_activity = 5;
  repeated string capabilities = 6;
}

message SearchRequest {
  string query = 1;
  repeated string scopes = 2;
  uint32 limit = 3;
  // Optional signed actor assertion (ADR-16 D9). When present it is verified and the
  // scopes DERIVED (wire scopes ignored); when absent the wire scopes are used
  // (the legacy dual-accept path — lets the channel start signing before 6b's cutover).
  string assertion = 4;
}

message SearchHit {
  int64 id = 1;
  string type = 2;
  string key = 3;
  double score = 4;
}

message SearchResponse {
  repeated SearchHit hits = 1;
}

// --- Deliberation (ADR-15) -------------------------------------------------

message DeliberationRequest {
  string ask_ref = 1;
  // Allowed visibility scopes for this context (default-deny; same as AskRequest).
  repeated string scopes = 2;
  // The requesting viewer; must own the retained deliberation (ADR-7).
  string viewer = 3;
}

// One panel model's raw take, before the judge synthesized the single voice.
message PanelTake {
  string model = 1;
  string answer = 2;
}

message DeliberationResponse {
  // FOUND ⇒ the panel view below; NOT_FOUND ⇒ unknown/expired ask_ref, or the
  // viewer is not the owner / current scopes no longer cover it (existence never
  // revealed); a non-FOUND response carries ONLY status (no partial read).
  AnswerStatus status = 1;
  string ask_ref = 2;
  string answer = 3;
  double confidence = 4;
  // Mean pairwise panel disagreement [0,1] — a confidence signal (ADR-7).
  double disagreement = 5;
  repeated PanelTake panel = 6;
  string judge = 7;
  // When the deliberation ran (ISO-8601), matching StatusResponse.last_activity.
  string created_at = 8;
}

// --- Neighborhood (ADR-15) -------------------------------------------------

message NeighborhoodRequest {
  int64 node_id = 1;                  // the center (e.g. a SearchHit.id)
  uint32 depth = 2;                   // hops; clamped to [1,2]; 0 ⇒ default 1
  uint32 node_limit = 3;              // max nodes; clamped to [1,50]; 0 ⇒ default 50
  repeated string relation_types = 4; // edge-type filter; empty ⇒ all types
  repeated string scopes = 5;
  string viewer = 6;
}

message NodeView {
  int64 id = 1;
  string type = 2;
  string key = 3;
  string scope = 4;       // always within the request scopes
  double confidence = 5;  // best-path confidence from the center
  uint32 depth = 6;       // min hop-distance from the center
}

message EdgeView {
  int64 src_id = 1;
  int64 dst_id = 2;
  string relation = 3;
  double reliability = 4;
}

message NeighborhoodResponse {
  AnswerStatus status = 1;       // FOUND | NOT_FOUND (center not visible/absent) | ERROR
  int64 center_id = 2;
  repeated NodeView nodes = 3;   // excludes the center; confidence desc then id
  repeated EdgeView edges = 4;   // only between returned in-scope nodes; (src,dst,relation)
  bool truncated = 5;            // node_limit or ADR-3 edge-budget hit (best-effort)
}

// --- ActivityFeed (ADR-15) -------------------------------------------------

message ActivityFeedRequest {
  string cursor = 1;                 // opaque resume token from a prior next_cursor; "" ⇒ most recent
  uint32 limit = 2;                  // clamped to [1,100]; 0 ⇒ default 50
  repeated string kinds = 3;         // event-kind filter (closed set); empty ⇒ all kinds
  repeated string scopes = 4;
  string viewer = 5;
}

message ActivityEvent {
  string kind = 1;          // closed set, e.g. "node_added" | "edge_reinforced" | "node_merged"
  string at = 2;            // ISO-8601
  string subject_type = 3;  // referenced node type (scope-gated, in-scope only); "" if none
  string outcome = 4;       // typed outcome (e.g. "merged" | "refused"); "" if n/a
  int64 count = 5;          // typed count of IN-SCOPE subjects only; 0 if n/a
}

message ActivityFeedResponse {
  AnswerStatus status = 1;            // FOUND | NOT_FOUND (no visible events) | ERROR
  repeated ActivityEvent events = 2;  // already scope-filtered; ordered oldest→newest within the page
  string next_cursor = 3;             // opaque token to pass as the next request.cursor
}
