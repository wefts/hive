{# A PENDING reply (thinking-block, cheap step) — the reply-thread twin of
   _post_pending.html: instant question + live counter, replaced by the final
   _post_reply.html when the real /ask completes. #}
<div class="post-reply post-pending">
  <div class="reply-q">
    <span class="thread-who">you</span>
    <span class="meta">{{ asked_at }}</span>
    <p class="reply-question">{{ q }}</p>
  </div>

  <div class="thinking live" x-data="{ s: 0 }" x-init="setInterval(() => s++, 1000)">
    <span class="thinking-label">thinking<span class="pulse">…</span></span>
    <span class="meta"><span x-text="s">0</span>s</span>
  </div>

  <form hx-post="/ask" hx-trigger="load" hx-target="closest .post-pending" hx-swap="outerHTML"
        hx-on::send-error="this.previousElementSibling.querySelector('.thinking-label').textContent = 'could not reach the server'">
    <input type="hidden" name="q" value="{{ q }}">
    <input type="hidden" name="thread_id" value="{{ thread_id }}">
  </form>
</div>
