{% extends "base.html" %}
{% from "_ui.html" import unavailable %}
{% block content %}
<div class="card login">
  <header>
    <h2>Local sign in</h2>
    <p>A channel-local account — the password is checked here, authority comes from the kernel.</p>
  </header>
  <section>
    {% if error %}{{ unavailable(error) }}{% endif %}
    <form class="form-grid" method="post" action="/login/local" autocomplete="off">
      <div class="field">
        <label class="label" for="login-user">Username</label>
        <input class="input" id="login-user" type="text" name="identifier" value="{{ identifier }}" readonly>
      </div>
      <div class="field">
        <label class="label" for="login-pw">Password</label>
        <input class="input" id="login-pw" type="password" name="password" autofocus required>
      </div>
      <div class="form-actions">
        <button class="btn" type="submit">Sign in</button>
        <a class="btn" data-variant="ghost" href="/login">Use a different account</a>
      </div>
    </form>
  </section>
</div>
{% endblock %}
